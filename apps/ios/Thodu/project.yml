name: Thodu
options:
  bundleIdPrefix: com.thodu
  createIntermediateGroups: true
targets:
  Thodu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Thodu
        CFBundleURLTypes:
          - CFBundleURLName: com.thodu.app
            CFBundleURLSchemes:
              - com.thodu.app
              - com.googleusercontent.apps.814572872575-bdse43grh3kv1lv0umqaqo58qg684e9i
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Thodu uses camera for verification"
        NSFaceIDUsageDescription: "Thodu uses Face ID for authentication"
        NSLocationWhenInUseUsageDescription: "Thodu uses your location to pinpoint your loved one's residence for caregiver dispatch and live emergency tracking."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Thodu uses your location to pinpoint your loved one's residence for caregiver dispatch and live emergency tracking."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thodu.app
        PRODUCT_NAME: Thodu
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UDYR7AUVZ7
